name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Lecture seule : le build Astro valide les liens internes
# (starlight-links-validator, BLOQUANT) — il ne publie rien. La publication
# GitHub Pages (scopes `pages`/`id-token`, `deploy-pages`) est spécifique GitHub
# et a été retirée lors du portage Gitea (ADR 0115).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Date de dernière modif par fichier (lastUpdated) → git log complet.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
      # uv + Python : `pnpm docs:build` enchaîne `docs:prepare` (script Python
      # migrate_docs_to_astro.py --content-only, ADR 0089) avant `astro build`.
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: pnpm install --frozen-lockfile
      - name: Build Astro Starlight
        run: pnpm docs:build
